[package]
name = "pgexplain"
version = "0.1.0"
edition = "2021"
description = "Renders Postgres EXPLAIN (ANALYZE, FORMAT JSON) as a readable tree, highlighting the actually-slow node"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/pgexplain"
readme = "README.md"
keywords = ["postgres", "explain", "query-plan", "performance", "sql"]
categories = ["command-line-utilities", "database"]

[lib]
name = "pgexplain"
path = "src/lib.rs"

[[bin]]
name = "pgexplain"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
